name: ciccd_task_2
run-name: ${{ github.actor }} - ${{ github.sha }}

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VARIABLE: 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        name: Setup Python ${{ env.PYTHON_VARIABLE }}
        with:
          python-version: '${{ env.PYTHON_VARIABLE }}'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --statistics --max-complexity=10 --exit-zero

      - name: Run unit tests by pytest
        run: |
          pytest --cov-report=term-missing —-cov=. --cov-report=json


